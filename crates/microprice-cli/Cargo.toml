[package]
name = "microprice-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["finance", "algorithms", "command-line-utilities"]
authors.workspace = true
description = "Command-line interface for MicroPrice-Rust: train, predict, inspect, benchmark, evaluate (synthetic or CSV), and visualize."

[[bin]]
name = "microprice"
path = "src/main.rs"

[dependencies]
microprice-core.workspace = true
microprice-calibration.workspace = true
microprice-data.workspace = true
microprice-eval.workspace = true
clap.workspace = true
plotters.workspace = true

[features]
# Off by default so the default build stays lean: arrow/parquet are a large
# dependency tree that only `evaluate-parquet` needs. Enable with
# `--features parquet`. (`cargo test --all-features`, as CI runs it, includes it.)
parquet = ["microprice-data/parquet-ingestion"]
