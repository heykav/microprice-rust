<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="t d"><title id="t">How a micro-price differs from the mid</title><desc id="d">Illustrative schematic, not data. An animated order book where queue imbalance moves the micro-price off the mid, next to the four calibration steps the library follows: discretize quotes into imbalance and spread states, estimate a Markov chain, solve for the G star adjustment, output mid plus G star.</desc><style>
.pa{opacity:1}.pb{opacity:0}.pc{opacity:0}.mk{transform:translateX(20px)}
@keyframes fa{0%,28%{opacity:1}34%,88%{opacity:0}94%,100%{opacity:1}}
@keyframes fb{0%,28%{opacity:0}34%,56%{opacity:1}62%,100%{opacity:0}}
@keyframes fc{0%,56%{opacity:0}62%,84%{opacity:1}90%,100%{opacity:0}}
@keyframes mv{0%,28%{transform:translateX(20px)}36%,56%{transform:translateX(0)}64%,84%{transform:translateX(-20px)}93%,100%{transform:translateX(20px)}}
.an .pa{animation:fa 12s ease-in-out infinite}
.an .pb{animation:fb 12s ease-in-out infinite}
.an .pc{animation:fc 12s ease-in-out infinite}
.an .mk{animation:mv 12s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.an .pa,.an .pb,.an .pc,.an .mk{animation:none}}
</style><rect width="1280" height="560" fill="#090A09"/><g class="an"><rect x="0.75" y="0.75" width="1278.5" height="558.5" rx="14" fill="none" stroke="#2a2c29" stroke-width="1.5"/><text x="48" y="56" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" font-weight="bold" fill="#00FF66" text-anchor="start" >HOW IT WORKS  /  ILLUSTRATIVE, NOT DATA</text><text x="48" y="92" font-family="Georgia,'Times New Roman',serif" font-size="28" font-weight="bold" fill="#F4F5F2" text-anchor="start" >Queue imbalance pushes the fair price off the mid</text><rect x="48" y="116" width="640" height="400" rx="10" fill="#111211" stroke="#2a2c29"/><circle cx="70" cy="136" r="5" fill="#ff5f57"/><circle cx="88" cy="136" r="5" fill="#febc2e"/><circle cx="106" cy="136" r="5" fill="#28c840"/><text x="368.0" y="141" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12" font-weight="normal" fill="#9a9c96" text-anchor="middle" >orderbook.schematic</text><line x1="48" y1="156" x2="688" y2="156" stroke="#2a2c29"/><g class="pa"><text x="80" y="190" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="16" font-weight="bold" fill="#F4F5F2" text-anchor="start" >imbalance 0.75  (bid-heavy)</text></g><g class="pb"><text x="80" y="190" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="16" font-weight="bold" fill="#F4F5F2" text-anchor="start" >imbalance 0.50  (balanced)</text></g><g class="pc"><text x="80" y="190" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="16" font-weight="bold" fill="#F4F5F2" text-anchor="start" >imbalance 0.25  (ask-heavy)</text></g><line x1="138" y1="398" x2="598" y2="398" stroke="#2a2c29" stroke-width="1.5"/><line x1="138" y1="348" x2="598" y2="348" stroke="#1a1b1a"/><line x1="138" y1="298" x2="598" y2="298" stroke="#1a1b1a"/><line x1="138" y1="248" x2="598" y2="248" stroke="#1a1b1a"/><g class="pa"><rect x="288.0" y="258" width="40" height="140" rx="3" fill="#00FF66" opacity="1.00"/><rect x="408.0" y="352" width="40" height="46" rx="3" fill="#B6FF2E" opacity="1.00"/><rect x="230.0" y="298" width="40" height="100" rx="3" fill="#00FF66" opacity="0.82"/><rect x="466.0" y="328" width="40" height="70" rx="3" fill="#B6FF2E" opacity="0.82"/><rect x="172.0" y="328" width="40" height="70" rx="3" fill="#00FF66" opacity="0.64"/><rect x="524.0" y="303" width="40" height="95" rx="3" fill="#B6FF2E" opacity="0.64"/><rect x="114.0" y="353" width="40" height="45" rx="3" fill="#00FF66" opacity="0.46"/><rect x="582.0" y="283" width="40" height="115" rx="3" fill="#B6FF2E" opacity="0.46"/></g><g class="pb"><rect x="288.0" y="308" width="40" height="90" rx="3" fill="#00FF66" opacity="1.00"/><rect x="408.0" y="308" width="40" height="90" rx="3" fill="#B6FF2E" opacity="1.00"/><rect x="230.0" y="318" width="40" height="80" rx="3" fill="#00FF66" opacity="0.82"/><rect x="466.0" y="318" width="40" height="80" rx="3" fill="#B6FF2E" opacity="0.82"/><rect x="172.0" y="328" width="40" height="70" rx="3" fill="#00FF66" opacity="0.64"/><rect x="524.0" y="328" width="40" height="70" rx="3" fill="#B6FF2E" opacity="0.64"/><rect x="114.0" y="343" width="40" height="55" rx="3" fill="#00FF66" opacity="0.46"/><rect x="582.0" y="343" width="40" height="55" rx="3" fill="#B6FF2E" opacity="0.46"/></g><g class="pc"><rect x="288.0" y="352" width="40" height="46" rx="3" fill="#00FF66" opacity="1.00"/><rect x="408.0" y="258" width="40" height="140" rx="3" fill="#B6FF2E" opacity="1.00"/><rect x="230.0" y="328" width="40" height="70" rx="3" fill="#00FF66" opacity="0.82"/><rect x="466.0" y="298" width="40" height="100" rx="3" fill="#B6FF2E" opacity="0.82"/><rect x="172.0" y="303" width="40" height="95" rx="3" fill="#00FF66" opacity="0.64"/><rect x="524.0" y="328" width="40" height="70" rx="3" fill="#B6FF2E" opacity="0.64"/><rect x="114.0" y="283" width="40" height="115" rx="3" fill="#00FF66" opacity="0.46"/><rect x="582.0" y="353" width="40" height="45" rx="3" fill="#B6FF2E" opacity="0.46"/></g><line x1="368" y1="228" x2="368" y2="406" stroke="#F4F5F2" stroke-width="1.5" stroke-dasharray="4 4"/><text x="368" y="220" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12" font-weight="normal" fill="#9a9c96" text-anchor="middle" >mid</text><g class="mk"><line x1="368" y1="248" x2="368" y2="398" stroke="#00FF66" stroke-width="2.5"/><path d="M368 404 l-7 12 h14 z" fill="#00FF66"/><text x="368" y="438" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12" font-weight="bold" fill="#00FF66" text-anchor="middle" >micro-price</text></g><text x="138" y="416" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12" font-weight="normal" fill="#00FF66" text-anchor="start" >bids</text><text x="598" y="416" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12" font-weight="normal" fill="#B6FF2E" text-anchor="end" >asks</text><g class="pa"><text x="80" y="496" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" font-weight="normal" fill="#c7c9c4" text-anchor="start" >more size on the bid: the next move is more likely up</text></g><g class="pb"><text x="80" y="496" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" font-weight="normal" fill="#c7c9c4" text-anchor="start" >equal queues: no pressure, micro-price sits on the mid</text></g><g class="pc"><text x="80" y="496" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" font-weight="normal" fill="#c7c9c4" text-anchor="start" >more size on the ask: the next move is more likely down</text></g><rect x="720" y="116" width="512" height="88" rx="10" fill="#111211" stroke="#2a2c29"/><circle cx="758" cy="160" r="16" fill="none" stroke="#00FF66" stroke-width="2"/><text x="758" y="166" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="16" font-weight="bold" fill="#00FF66" text-anchor="middle" >1</text><text x="790" y="150" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#F4F5F2" text-anchor="start" >Discretize</text><text x="790" y="172" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#c7c9c4" text-anchor="start" >Each quote becomes a state:</text><text x="790" y="190" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#c7c9c4" text-anchor="start" >(imbalance bucket, spread bucket).</text><rect x="720" y="216" width="512" height="88" rx="10" fill="#111211" stroke="#2a2c29"/><circle cx="758" cy="260" r="16" fill="none" stroke="#00FF66" stroke-width="2"/><text x="758" y="266" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="16" font-weight="bold" fill="#00FF66" text-anchor="middle" >2</text><text x="790" y="250" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#F4F5F2" text-anchor="start" >Estimate</text><text x="790" y="272" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#c7c9c4" text-anchor="start" >Count state transitions and mid</text><text x="790" y="290" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#c7c9c4" text-anchor="start" >moves to build a Markov chain.</text><rect x="720" y="316" width="512" height="88" rx="10" fill="#111211" stroke="#2a2c29"/><circle cx="758" cy="360" r="16" fill="none" stroke="#00FF66" stroke-width="2"/><text x="758" y="366" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="16" font-weight="bold" fill="#00FF66" text-anchor="middle" >3</text><text x="790" y="350" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#F4F5F2" text-anchor="start" >Solve</text><text x="790" y="372" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#c7c9c4" text-anchor="start" >Iterate the recursion to a fixed</text><text x="790" y="390" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#c7c9c4" text-anchor="start" >point: the adjustment G*(state).</text><rect x="720" y="416" width="512" height="88" rx="10" fill="#111211" stroke="#2a2c29"/><circle cx="758" cy="460" r="16" fill="none" stroke="#00FF66" stroke-width="2"/><text x="758" y="466" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="16" font-weight="bold" fill="#00FF66" text-anchor="middle" >4</text><text x="790" y="450" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#F4F5F2" text-anchor="start" >Output</text><text x="790" y="472" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#c7c9c4" text-anchor="start" >micro-price = mid + G*(state)</text><text x="790" y="490" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#c7c9c4" text-anchor="start" >an estimate of the future mid.</text><text x="720" y="540" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#B6FF2E" text-anchor="start" >Does not beat the naive mid on synthetic data or one real day of BTCUSDT.</text></g></svg>
