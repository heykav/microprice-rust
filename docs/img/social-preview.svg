<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d"><title id="t">MicroPrice-Rust</title><desc id="d">Social preview card for MicroPrice-Rust. Illustrative schematic, not data.</desc><style>
.pa{opacity:1}.pb{opacity:0}.pc{opacity:0}.mk{transform:translateX(20px)}
@keyframes fa{0%,28%{opacity:1}34%,88%{opacity:0}94%,100%{opacity:1}}
