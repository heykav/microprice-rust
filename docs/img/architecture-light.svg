<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
<title id="t">MicroPrice-Rust crate layout</title>
<desc id="d">Dependency diagram of the workspace: microprice-cli depends on eval, calibration and data; microprice-python (separate workspace) depends on calibration and data; eval depends on calibration; data and calibration depend on core. All crates depend on microprice-core.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker></defs>
<rect width="1200" height="560" fill="#ffffff"/>
<text x="40" y="36" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2328">Crate layout</text>
<text x="1160" y="36" text-anchor="end" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">arrow: depends on (from Cargo.toml)</text>
<rect x="40" y="70" width="560" height="110" rx="8" fill="#f6f8fa" stroke="#0b6bcb" stroke-width="1.8"/><text x="58" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="700" fill="#0b6bcb">microprice-cli</text><text x="58" y="124" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">binary `microprice`: train · predict · inspect · benchmark</text><text x="58" y="143" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">evaluate · evaluate-csv · evaluate-parquet (feature) · visualize</text><text x="58" y="162" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">plotters PNG output · clap</text><rect x="660" y="70" width="500" height="110" rx="8" fill="#f6f8fa" stroke="#c2410c" stroke-width="1.8" stroke-dasharray="6 4"/><text x="678" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="700" fill="#c2410c">microprice-python</text><text x="678" y="124" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">PyO3 bindings, built with maturin</text><text x="678" y="143" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">load · save · predict · predict_batch · metadata · train_synthetic</text><text x="678" y="162" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">own Cargo workspace (not a root member)</text><rect x="40" y="235" width="290" height="110" rx="8" fill="#f6f8fa" stroke="#0f766e" stroke-width="1.8"/><text x="58" y="265" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="700" fill="#0f766e">microprice-eval</text><text x="58" y="289" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">chronological split, metrics</text><text x="58" y="308" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">compare_predictors: paired</text><text x="58" y="327" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">baselines, block bootstrap</text><rect x="370" y="235" width="330" height="110" rx="8" fill="#f6f8fa" stroke="#0f766e" stroke-width="1.8"/><text x="388" y="265" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="700" fill="#0f766e">microprice-calibration</text><text x="388" y="289" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">transition counting, estimation,</text><text x="388" y="308" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">solver (G* = G1 + Q G*)</text><text x="388" y="327" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">MicroPriceModel: bincode + JSON</text><rect x="740" y="235" width="420" height="110" rx="8" fill="#f6f8fa" stroke="#0f766e" stroke-width="1.8"/><text x="758" y="265" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="700" fill="#0f766e">microprice-data</text><text x="758" y="289" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">synthetic generator (deterministic)</text><text x="758" y="308" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">Level-1 CSV: generic · Binance · LOBSTER</text><text x="758" y="327" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">Parquet (optional feature)</text><rect x="40" y="400" width="1120" height="90" rx="8" fill="#f6f8fa" stroke="#59636e" stroke-width="1.8"/><text x="58" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="700" fill="#59636e">microprice-core</text><text x="58" y="454" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">integer-tick prices and quantities, validated TopOfBook, imbalance, state discretization</text><text x="58" y="473" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">only external dependency: thiserror</text><path d="M185 180 L185 235" stroke="#59636e" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><path d="M450 180 L450 235" stroke="#59636e" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><path d="M560 180 L820 235" stroke="#59636e" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><path d="M720 180 L640 235" stroke="#59636e" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><path d="M1040 180 L1040 235" stroke="#59636e" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><path d="M330 300 L370 300" stroke="#59636e" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><path d="M185 345 L185 400" stroke="#59636e" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><path d="M535 345 L535 400" stroke="#59636e" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><path d="M950 345 L950 400" stroke="#59636e" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="40" y="524" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">microprice-cli and microprice-python also depend on microprice-core directly (edges omitted for clarity). Dashed border: separate Cargo workspace, built with maturin.</text><text x="40" y="545" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">Inputs: synthetic generator, Level-1 CSV, Parquet. Outputs: model artifact (bincode + JSON sidecar), metrics, static PNG plots.</text></svg>
