<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d"><title id="t">MicroPrice-Rust</title><desc id="d">Banner for MicroPrice-Rust, queue-imbalance micro-price estimation for limit order books in Rust. An animated order-book schematic shows the micro-price moving off the mid as queue imbalance changes. The schematic is illustrative, not data. Status: research code, synthetic data only, no real-data result yet, and on synthetic data the micro-price does not beat the naive mid.</desc><style>
.pa{opacity:1}.pb{opacity:0}.pc{opacity:0}.mk{transform:translateX(20px)}
@keyframes fa{0%,28%{opacity:1}34%,88%{opacity:0}94%,100%{opacity:1}}
@keyframes fb{0%,28%{opacity:0}34%,56%{opacity:1}62%,100%{opacity:0}}
@keyframes fc{0%,56%{opacity:0}62%,84%{opacity:1}90%,100%{opacity:0}}
@keyframes mv{0%,28%{transform:translateX(20px)}36%,56%{transform:translateX(0)}64%,84%{transform:translateX(-20px)}93%,100%{transform:translateX(20px)}}
.an .pa{animation:fa 12s ease-in-out infinite}
.an .pb{animation:fb 12s ease-in-out infinite}
.an .pc{animation:fc 12s ease-in-out infinite}
.an .mk{animation:mv 12s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.an .pa,.an .pb,.an .pc,.an .mk{animation:none}}
</style><rect width="1280" height="420" fill="#090A09"/><g class="an"><rect x="0.75" y="0.75" width="1278.5" height="418.5" rx="14" fill="none" stroke="#2a2c29" stroke-width="1.5"/><text x="64" y="74" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" font-weight="bold" fill="#00FF66" text-anchor="start" >RESEARCH CODE  /  SYNTHETIC DATA ONLY</text><text x="64" y="144" font-family="Georgia,'Times New Roman',serif" font-size="64" font-weight="bold" fill="#F4F5F2" text-anchor="start" >MicroPrice<tspan fill="#00FF66">-Rust</tspan></text><text x="66" y="190" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="normal" fill="#c7c9c4" text-anchor="start" >Queue-imbalance micro-price estimation</text><text x="66" y="220" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="normal" fill="#c7c9c4" text-anchor="start" >for limit order books, in Rust.</text><text x="66" y="262" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="17" font-weight="normal" fill="#B6FF2E" text-anchor="start" >mid + G*(imbalance, spread)</text><rect x="64" y="296" width="560" height="76" rx="8" fill="#14180f" stroke="#2a2c29"/><rect x="64" y="296" width="5" height="76" rx="2" fill="#B6FF2E"/><text x="86" y="322" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12" font-weight="bold" fill="#B6FF2E" text-anchor="start" >STATUS</text><text x="86" y="344" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#F4F5F2" text-anchor="start" >No real-data result yet. On the project's synthetic data</text><text x="86" y="362" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#F4F5F2" text-anchor="start" >the micro-price does not beat the naive mid (MAE 0.1094 vs 0.0988 ticks).</text><text x="66" y="398" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" font-weight="normal" fill="#9a9c96" text-anchor="start" >github.com/heykav/microprice-rust</text><rect x="676" y="40" width="556" height="340" rx="10" fill="#111211" stroke="#2a2c29"/><circle cx="698" cy="60" r="5" fill="#ff5f57"/><circle cx="716" cy="60" r="5" fill="#febc2e"/><circle cx="734" cy="60" r="5" fill="#28c840"/><text x="954.0" y="65" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12" font-weight="normal" fill="#9a9c96" text-anchor="middle" >orderbook.schematic   (illustrative, not data)</text><line x1="676" y1="80" x2="1232" y2="80" stroke="#2a2c29"/><g class="pa"><text x="704" y="110" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" font-weight="bold" fill="#F4F5F2" text-anchor="start" >imbalance 0.75  (bid-heavy)</text></g><g class="pb"><text x="704" y="110" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" font-weight="bold" fill="#F4F5F2" text-anchor="start" >imbalance 0.50  (balanced)</text></g><g class="pc"><text x="704" y="110" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" font-weight="bold" fill="#F4F5F2" text-anchor="start" >imbalance 0.25  (ask-heavy)</text></g><line x1="724" y1="292" x2="1184" y2="292" stroke="#2a2c29" stroke-width="1.5"/><line x1="724" y1="242" x2="1184" y2="242" stroke="#1a1b1a"/><line x1="724" y1="192" x2="1184" y2="192" stroke="#1a1b1a"/><line x1="724" y1="142" x2="1184" y2="142" stroke="#1a1b1a"/><g class="pa"><rect x="880.0" y="152" width="34" height="140" rx="3" fill="#00FF66" opacity="1.00"/><rect x="994.0" y="246" width="34" height="46" rx="3" fill="#B6FF2E" opacity="1.00"/><rect x="830.0" y="192" width="34" height="100" rx="3" fill=