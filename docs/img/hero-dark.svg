"ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12" font-weight="normal" fill="#9a9c96" text-anchor="middle" >mid</text><g class="mk"><line x1="954" y1="142" x2="954" y2="292" stroke="#00FF66" stroke-width="2.5"/><path d="M954 298 l-7 12 h14 z" fill="#00FF66"/><text x="954" y="332" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12" font-weight="bold" fill="#00FF66" text-anchor="middle" >micro-price</text></g><text x="724" y="310" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12" font-weight="normal" fill="#00FF66" text-anchor="start" >bids</text><text x="1184" y="310" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12" font-weight="normal" fill="#B6FF2E" text-anchor="end" >asks</text><g class="pa"><text x="704" y="366" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12" font-weight="normal" fill="#c7c9c4" text-anchor="start" >more size on the bid: the next move is more likely up</text></g><g class="pb"><text x="704" y="366" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12" font-weight="normal" fill="#c7c9c4" text-anchor="start" >equal queues: no pressure, micro-price sits on the mid</text></g><g class="pc"><text x="704" y="366" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12" font-weight="normal" fill="#c7c9c4" text-anchor="start" >more size on the ask: the next move is more likely down</text></g></g></svg>
