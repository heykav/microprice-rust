[workspace]
resolver = "2"
members = [
    "crates/microprice-core",
    "crates/microprice-calibration",
    "crates/microprice-data",
    "crates/microprice-eval",
    "crates/microprice-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/heykav/microprice-rust"

[workspace.dependencies]
microprice-core = { path = "crates/microprice-core" }
microprice-calibration = { path = "crates/microprice-calibration" }
microprice-data = { path = "crates/microprice-data" }
microprice-eval = { path = "crates/microprice-eval" }
clap = { version = "4", features = ["derive"] }
# Default features (font-kit-based "ttf" text rendering) require the
# system fontconfig library on Linux - see the `libfontconfig1-dev` apt
# install in .github/workflows/ci.yml's clippy/test/doc jobs, added after
# this broke real CI the first time ("Package fontconfig was not found in
# the pkg-config search path"). Tried switching to the pure-Rust
# `ab_glyph` font backend instead, but it requires the caller to
# explicitly `register_font()` an embedded font file with no built-in
# fallback (`FontError::FontUnavailable` otherwise) - installing
# fontconfig in CI is the smaller, more standard fix, used broadly for
# font-kit-dependent crates, versus bundling a font asset in this repo.
plotters = "0.3"
thiserror = "2"
proptest = "1"
criterion = "0.8"
rand = "0.10"
rand_chacha = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned to 2.0.1, not "3": bincode 3.0.0 on crates.io is a broken
# placeholder release (its lib.rs is a bare `compile_error!` referencing
# the XKCD dependency joke, verified by downloading and inspecting the
# actual crate source before trusting a plain `bincode = "3"` requirement).
bincode = { version = "=2.0.1", features = ["serde"] }
