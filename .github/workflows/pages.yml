name: Deploy interactive demo to Pages

# Deploys only site/ - not docs/, which holds this project's real
# markdown documentation (model-spec.md, benchmarking.md, ...) and must
# never be handed to Jekyll/Pages processing.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
